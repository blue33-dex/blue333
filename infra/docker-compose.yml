name: ordermgmt

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ordermgmt}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
    # Demo credentials are public, so every port is bound to the local machine only.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ordermgmt-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  seaweed-s3-config:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/seaweed-s3-config-init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?S3_ADMIN_ACCESS_KEY must be set}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?S3_ADMIN_SECRET_KEY must be set}
    volumes:
      - ./scripts/seaweed-s3-config-init.sh:/scripts/seaweed-s3-config-init.sh:ro
      - seaweed-s3-config:/config

  seaweedfs:
    image: chrislusf/seaweedfs:3.94
    restart: unless-stopped
    # SeaweedFS 3.94 does not implement PutBucketCors; CORS origins are set on the gateway instead.
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -s3.allowedOrigins=${S3_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    volumes:
      - ordermgmt-seaweed-data:/data
      - seaweed-s3-config:/etc/seaweedfs:ro
    depends_on:
      seaweed-s3-config:
        condition: service_completed_successfully

  seaweed-s3-init:
    image: amazon/aws-cli:2.17.0
    restart: "no"
    entrypoint: ["/bin/sh", "/scripts/seaweed-s3-bucket-init.sh"]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?S3_ADMIN_ACCESS_KEY must be set}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?S3_ADMIN_SECRET_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-ordermgmt}
    volumes:
      - ./scripts/seaweed-s3-bucket-init.sh:/scripts/seaweed-s3-bucket-init.sh:ro
    depends_on:
      seaweedfs:
        condition: service_started

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ordermgmt}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ACCESS_TOKEN_TTL_MS: ${JWT_ACCESS_TOKEN_TTL_MS:-1800000}
      JWT_REFRESH_TOKEN_TTL_MS: ${JWT_REFRESH_TOKEN_TTL_MS:-604800000}
      S3_ENDPOINT: http://seaweedfs:8333
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
      S3_BUCKET: ${S3_BUCKET:-ordermgmt}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      seaweed-s3-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.24-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ordermgmt-mysql-data:
    name: ordermgmt-mysql-data
  ordermgmt-seaweed-data:
    name: ordermgmt-seaweed-data
  seaweed-s3-config:
    name: ordermgmt-seaweed-s3-config
