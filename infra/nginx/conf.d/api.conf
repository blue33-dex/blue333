upstream ordermgmt_backend {
  server backend:8080;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  # P1-T01 health endpoint used only by the Nginx container healthcheck.
  location = /nginx-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Before a frontend is served by Nginx, the root endpoint intentionally
  # reports Bad Gateway, as required by P1-T01 acceptance criteria.
  location = / {
    return 502;
  }

  # P4-T09 SSE notification stream: unbuffered, long-lived, no gzip so events flush immediately.
  location = /api/v1/notifications/stream {
    proxy_pass http://ordermgmt_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    gzip off;
  }

  location /api/ {
    proxy_pass http://ordermgmt_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
}
