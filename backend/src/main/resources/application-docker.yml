spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:ordermgmt}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: ${MYSQL_USER:ordermgmt_app}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never
