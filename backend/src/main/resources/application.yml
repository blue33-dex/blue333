server:
  port: 8080

spring:
  application:
    name: ordermgmt-backend
  jpa:
    open-in-view: false

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-ms: ${JWT_ACCESS_TOKEN_TTL_MS:1800000}
    refresh-token-ttl-ms: ${JWT_REFRESH_TOKEN_TTL_MS:604800000}

storage:
  minio:
    endpoint: ${MINIO_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:ordermgmt}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
