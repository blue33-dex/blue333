server:
  port: 8080

spring:
  application:
    name: ordermgmt-backend

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-ms: ${JWT_ACCESS_TOKEN_TTL_MS:1800000}
    refresh-token-ttl-ms: ${JWT_REFRESH_TOKEN_TTL_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
